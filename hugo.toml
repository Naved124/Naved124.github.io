# Site settings — edit the [params] block to make it yours.
baseURL = "https://navedkhan.dev/"   # the deploy workflow overrides this automatically
locale = "en-US"
title = "naved // security notes"
enableRobotsTXT = true
summaryLength = 30
titleCaseStyle = "none"   # keep tags lowercase (#web, not #Web)

[params]
  author      = "MD Naved Raja Khan"
  handle      = "naved"
  description = "MD Naved Raja Khan, security researcher & systems programmer: how I build low-level security tools, what they catch, and what still gets past them."
  github      = "https://github.com/Naved124"
  linkedin    = "https://www.linkedin.com/in/md-naved-raja-khan-5102a52a0" 
  x           = "https://x.com/NavedKhan371877"

[menus]
  [[menus.main]]
    name = "writeups"
    pageRef = "/writeups"
    weight = 10
  [[menus.main]]
    name = "notes"
    pageRef = "/notes"
    weight = 20
  [[menus.main]]
    name = "bugs"
    pageRef = "/bugs"
    weight = 30
  [[menus.main]]
    name = "tags"
    pageRef = "/tags"
    weight = 40
  [[menus.main]]
    name = "portfolio"
    url = "https://navedkhan.dev/portfolio/"
    weight = 45
  [[menus.main]]
    name = "about"
    pageRef = "/about"
    weight = 50

[taxonomies]
  tag = "tags"

[markup]
  [markup.highlight]
    noClasses = false      # colours come from assets/css/syntax.css (light + dark)
    lineNos = false
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3
  [markup.goldmark.renderer]
    unsafe = false         # raw HTML in markdown stays disabled

[outputs]
  home = ["html", "rss"]
  section = ["html", "rss"]
