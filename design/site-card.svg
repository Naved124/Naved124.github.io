<svg xml:space="preserve" xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#091e3c"/><stop offset=".6" stop-color="#0c2e54"/><stop offset="1" stop-color="#12406e"/>
  </linearGradient>
  <radialGradient id="blue" cx="1" cy="0" r=".7"><stop offset="0" stop-color="#7aadff" stop-opacity=".28"/><stop offset="1" stop-color="#7aadff" stop-opacity="0"/></radialGradient>
  <radialGradient id="lilac" cx="0" cy=".45" r=".55"><stop offset="0" stop-color="#d7b8e0" stop-opacity=".2"/><stop offset="1" stop-color="#d7b8e0" stop-opacity="0"/></radialGradient>
  <linearGradient id="name" x1="0" x2="1"><stop offset=".2" stop-color="#e6ecf7"/><stop offset=".85" stop-color="#7aadff"/><stop offset="1.1" stop-color="#d7b8e0"/></linearGradient>
  <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#e6ecf7" fill-opacity=".05"/></pattern>
</defs>
<rect width="1200" height="630" fill="url(#sky)"/>
<rect width="1200" height="630" fill="url(#blue)"/>
<rect width="1200" height="630" fill="url(#lilac)"/>
<rect width="1200" height="630" fill="url(#dots)"/>
<g font-family="Maple Mono, monospace">
  <text x="64" y="86" font-size="22" font-weight="600" fill="#7aadff" letter-spacing="1.5">NAVEDKHAN.DEV</text>
  <text x="64" y="164" font-size="46" font-weight="700" fill="url(#name)">MD Naved Raja Khan</text>
  <g font-size="22" fill="#9aa8c2">
    <text x="64" y="218">Security researcher &amp; systems</text>
    <text x="64" y="250">programmer. How I build low-level</text>
    <text x="64" y="282">security tools, what they catch, and</text>
    <text x="64" y="314">what still gets past them.</text>
  </g>
  <text x="64" y="560" font-size="22" font-weight="600"><tspan fill="#d7b8e0">naved@sec</tspan><tspan fill="#9aa8c2"> · </tspan><tspan fill="#e6ecf7">navedkhan.dev</tspan></text>
  <!-- glass terminal -->
  <rect x="603" y="65" width="540" height="500" rx="16" fill="#191c24" fill-opacity=".62" stroke="#7aadff" stroke-opacity=".22"/>
  <line x1="603" y1="114" x2="1143" y2="114" stroke="#7aadff" stroke-opacity=".16"/>
  <circle cx="627" cy="90" r="6.5" fill="#ff5f57"/><circle cx="648" cy="90" r="6.5" fill="#febc2e"/><circle cx="669" cy="90" r="6.5" fill="#28c840"/>
  <text x="873" y="96" font-size="16" fill="#9aa8c2" text-anchor="middle">naved@sec: ~</text>
  <g font-size="19">
    <text x="627" y="163"><tspan fill="#7aadff" font-weight="700">$</tspan><tspan fill="#e6ecf7"> whoami</tspan></text>
    <text x="627" y="195" fill="#e6ecf7">security researcher &amp; systems programmer</text>
    <text x="627" y="258"><tspan fill="#7aadff" font-weight="700">$</tspan><tspan fill="#e6ecf7"> cat focus.txt</tspan></text>
    <text x="627" y="290" fill="#d7b8e0">runtime security · detection engineering</text>
    <text x="627" y="321" fill="#d7b8e0">binary analysis</text>
    <text x="627" y="384"><tspan fill="#7aadff" font-weight="700">$</tspan><tspan fill="#e6ecf7"> ls ~/projects</tspan></text>
    <text x="627" y="416" fill="#e6ecf7">tephra  fulgurite  logsift</text>
    <text x="627" y="447" fill="#e6ecf7">sentinel-detections  reconforge</text>
